<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-card {
            max-width: 400px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .form-control:focus {
            border-color: #80bdff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="auth-card bg-white">
            <h2 class="text-center mb-4">🔒 Login</h2>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="id_username" class="form-label">Usuário</label>
                    <input 
                        type="username" 
                        name="username" 
                        id="id_username" 
                        class="form-control" 
                        placeholder="Digite seu usuário"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label">Senha</label>
                    <input 
                        type="password" 
                        name="password" 
                        id="id_password" 
                        class="form-control" 
                        placeholder="••••••••"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
                
                <div class="text-center">
                    <small class="text-muted">
                        Não tem conta? <a href="{% url 'registrar' %}" class="text-decoration-none">Criar conta</a>
                    </small>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
