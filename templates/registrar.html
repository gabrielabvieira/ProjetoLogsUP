<!DOCTYPE html>
<html>
<head>
    <title>Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-card {
            max-width: 500px;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="auth-card bg-white">
            <h2 class="text-center mb-4">📝 Criar Conta</h2>
            <form method="post">
                {% csrf_token %}
                
                <div class="row mb-3 align-items-center">
                    <label for="{{ form.username.id_for_label }}" class="col-sm-4 col-form-label text-end">Usuário</label>
                    <div class="col-sm-8">
                        {{ form.username }}
                    </div>
                </div>
                
                <div class="row mb-3 align-items-center">
                    <label for="{{ form.nome.id_for_label }}" class="col-sm-4 col-form-label text-end">Nome Completo</label>
                    <div class="col-sm-8">
                        {{ form.nome }}
                    </div>
                </div>
            
                <div class="row mb-3 align-items-center">
                    <label for="{{ form.email.id_for_label }}" class="col-sm-4 col-form-label text-end">Email</label>
                    <div class="col-sm-8">
                        {{ form.email }}
                    </div>
                </div>
                
                <div class="row mb-3 align-items-center">
                    <label for="{{ form.password1.id_for_label }}" class="col-sm-4 col-form-label text-end">Senha</label>
                    <div class="col-sm-8">
                        {{ form.password1 }}
                    </div>
                </div>

                <div class="row mb-3 align-items-center">
                    <label for="{{ form.password2.id_for_label }}" class="col-sm-4 col-form-label text-end">Confirmar Senha</label>
                    <div class="col-sm-8">
                        {{ form.password2 }}
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 mb-3">Registrar</button>
            </form>
            <div class="text-center">
                <small class="text-muted">
                    Já tem conta? <a href="{% url 'login' %}" class="text-decoration-none">Fazer login</a>
                </small>
            </div>
        </div>
    </div>
</body>
</html>
